{{- if .Values.submission.enabled }}
{{- with .Values.submission.hostname }}
hostname = {{ . }}
{{- end }}

{{- with .Values.submission.relay }}
{{- if .credentials.secret.name }}

import_environment {
  SUBMISSION_RELAY_USER = %{env:SUBMISSION_RELAY_{{ default "USERNAME" .credentials.secret.usernameKey }} | default('dovecot')}
  SUBMISSION_RELAY_PASSWORD = %{env:SUBMISSION_RELAY_{{ default "PASSWORD" .credentials.secret.passwordKey }}}
}
{{- end }}

submission_relay_host = {{ required ".Values.submission.relay.host needs to be defined if submission is enabled" .host }}
{{- with .port }}
submission_relay_port = {{ . }}
{{- end }}
{{- if .ssl }}
submission_relay_ssl = {{ .ssl }}
  {{- if eq .ssl "no" }}
  {{- else if eq .ssl "starttls" }}
submission_relay_ssl_verify = {{ .sslVerify }}
  {{- else if eq . "smtps" }}
submission_relay_ssl_verify = {{ .sslVerify }}
  {{- else }}
    {{- fail ".Values.submission.relay.ssl must be undefined or one of 'smtps', 'starttls' or 'no'" -}}
  {{- end }}
{{- end }}
{{- if kindIs "bool" .trusted }}
submission_relay_trusted = {{ ternary "yes" "no" .trusted }}
{{- end }}

{{- if .credentials.secret }}
{{- if .credentials.master }}

submission_relay_master_user = $ENV:SUBMISSION_RELAY_USER
{{- else }}

submission_relay_user = $ENV:SUBMISSION_RELAY_USER
{{- end }}
submission_relay_password = $ENV:SUBMISSION_RELAY_PASSWORD
{{- end }}
{{- end }}
{{- end }}