## Dovecot configuration file

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap submission lmtp pop3 sieve

base_dir = /run/dovecot/
state_dir = /run/dovecot/

import_environment {
  DOVEADM_PASSWORD = %{env:DOVEADM_PASSWORD | default('supersecret')}
}

{{ .Values.auth.config }}

##
## Mailbox locations and namespaces
##
mail_driver = maildir
mailbox_list_layout = index
mailbox_list_utf8 = yes
mail_home = /srv/vmail/%{user | lower}
mail_path = %{home}/mail
mail_utf8_extensions = yes

mail_uid = vmail
mail_gid = vmail

# Setup default mailboxes for inbox namespace
@mailbox_defaults = english

namespace inbox {
  separator = /
  inbox = yes
}

mail_attribute {
  dict file {
    path = %{home}/dovecot-attributes
  }
}

ssl_server {
  cert_file = /etc/dovecot/ssl/tls.crt
  key_file = /etc/dovecot/ssl/tls.key
}

log_path = /dev/stdout

imap_hibernate_timeout = 5s

mail_plugins {
  fts = yes
  fts_flatcurve = yes
  mail_log = yes
  notify = yes
}

mail_log_events = delete expunge save copy mailbox_create mailbox_delete mailbox_rename flag_change

fts_autoindex = yes
fts_autoindex_max_recent_msgs = 999
fts_search_add_missing = yes
language_filters = normalizer-icu snowball stopwords

language_tokenizers = generic email-address
language_tokenizer_generic_algorithm = simple

language en {
  default = yes
  filters = lowercase snowball english-possessive stopwords
}

fts flatcurve {
  substring_search = yes
}

protocol imap {
  mail_plugins {
    imap_sieve = yes
    imap_filter_sieve = yes
  }
}

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

default_login_user = vmail
default_internal_user = vmail
default_internal_group = vmail

{{ range $service := .Values.services }}
service {{ .name }} {
  {{- range $listener := .listeners }}
  inet_listener {{ .name }} {
    port = {{ required (printf "%s listener for %s service must have containerPort defined." $listener.name $service.name) .containerPort }}
    {{- with .ssl }}
    ssl = {{ ternary "yes" "no" .enabled }}
    {{- if .tlsSecret }}
    ssl_server_cert_file = /etc/dovecot/{{ .name }}/tls.crt
    ssl_server_key_file = /etc/dovecot/{{ .name }}/tls.key
    {{- end }}
    {{- end }}
  }
  {{- end }}

  {{- with .processMinAvail }}
  process_min_avail = {{ . }}
  {{- end }}
  {{- with .clientLimit }}
  client_limit = {{ . }}
  {{- end }}
}
{{ end }}

doveadm_password = $ENV:DOVEADM_PASSWORD

event_exporter log {
  format = json
  time_format = rfc3339
}

# Add default backend metrics
@metric_defaults = backend

# log auth failures
metric auth_failures {
  filter = event=auth_request_finished AND NOT success=yes
  exporter = log
}

metric imap_command {
  filter = event=imap_command_finished
  group_by cmd_name {
    method discrete {
    }
  }
  group_by tagged_reply_state {
    method discrete {
    }
  }
}

metric smtp_command {
  filter = event=smtp_server_command_finished and protocol=submission
  group_by cmd_name {
    method discrete {
    }
  }
  group_by status_code {
    method discrete {
    }
  }
  group_by duration {
    method exponential {
      base = 10
      min_magnitude = 1
      max_magnitude = 5
    }
  }
}

metric lmtp_command {
  filter = event=smtp_server_command_finished and protocol=lmtp
  group_by cmd_name {
    method discrete {
    }
  }
  group_by status_code {
    method discrete {
    }
  }
  group_by duration {
    method exponential {
      base = 10
      min_magnitude = 1
      max_magnitude = 5
    }
  }
}

# Add duration metrics for deliveries
metric mail_deliveries {
  filter = event=mail_delivery_finished
  group_by duration {
    method exponential {
      base = 10
      min_magnitude = 1
      max_magnitude = 5
    }
  }
}
