apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-generator" (include "common.names.fullname" .) }}
roleRef:
  kind: Role
  name: {{ printf "%s-generator" (include "common.names.fullname" .) }}
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-generator" (include "common.names.fullname" .) }}
    namespace: {{ include "common.names.namespace" . }}
