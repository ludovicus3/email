namespace inbox {
  separator = /
  
  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Spam {
    special_use = \Spam
    auto = create
  }
  mailbox Junk {
    special_use = \Spam
  }

  mailbox Trash {
    special_use = \Trash
    auto = create
  }

  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox "Sent Messages" {
    special_use = \Sent
  }
}
