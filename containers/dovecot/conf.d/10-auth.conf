auth_master_user_separator = *
auth_default_domain = %{env:DEFAULT_DOMAIN}
auth_username_format = %{user | username | lower}
auth_mechanisms = plain login

passdb master {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/passwd.masterusers
  master = yes
  result_success = continue
}

passdb users {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/passwd.users
}

userdb users {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/passwd.users
}
